# All persisted state lives in /config and /photos. Recreating the container
# (e.g. after a docker compose pull / image update) destroys anything written
# only to the container filesystem, so both are bind-mounted below.
#
# Without these mounts every setting saved from the web page silently reverts
# to DEFAULT_CONFIG and the shown-photo history in tracking.txt is lost on the
# next image update.
#
# Usage:
#   1. Create a .env file next to this file containing:
#        IMMICH_API_KEY=<your-key>
#      (optionally: TZ=Europe/Berlin, EPF_PORT=15001)
#   2. docker compose up -d
#
services:
  epf:
    build: .
    image: epf:latest
    restart: unless-stopped
    ports:
      - "${EPF_PORT:-15001}:5000"
    environment:
      # Required. Compose refuses to start if this is unset, which is better
      # than booting with no key and having every Immich request return 401.
      IMMICH_API_KEY: ${IMMICH_API_KEY:?IMMICH_API_KEY is not set - create a .env file next to docker-compose.yml}
      # datetime.now() drives both the sleep window and the wake-up schedule.
      # The base image has no timezone, so without this both are evaluated in
      # UTC and land at the wrong hours. Zone data is already in the image.
      TZ: ${TZ:-Europe/Berlin}
    volumes:
      - ./config:/config
      - ./photos:/photos
    healthcheck:
      # The base image ships neither curl nor wget, so probe with python itself.
      # /sleep only reads the config, so this never reaches out to Immich.
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:5000/sleep', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 15s
