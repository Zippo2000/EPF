# Pytest configuration for the EPF server test suite.
#
#   Run offline unit tests (no network / no live Immich required):
#       python -m pytest
#   or from anywhere in the repo:
#       sh scripts/run-tests.sh          # builds a container and runs the suite
#
[pytest]
testpaths = tests
python_files = test_*.py
# Keep output compact; individual tests assert explicitly.
addopts = -ra
